name: Shrava
options:
  bundleIdPrefix: com.shrava
  deploymentTarget:
    macOS: "14.0"
    iOS: "26.1"
  xcodeVersion: "15.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    ENABLE_HARDENED_RUNTIME: YES

packages:
  ShravaCore:
    path: ./ShravaCore

targets:
  ShravaMac:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: ShravaMac/Sources
      - path: Shared
        excludes:
          - RecordingActivityAttributes.swift
          - StopRecordingIntent.swift
      - path: ShravaMac/Resources/Assets.xcassets
    dependencies:
      - package: ShravaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shrava.mac
        INFOPLIST_FILE: ShravaMac/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShravaMac/Resources/ShravaMac.entitlements
        LD_RUNPATH_SEARCH_PATHS: "@executable_path/../Frameworks"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
    info:
      path: ShravaMac/Resources/Info.plist
      properties:
        CFBundleName: Shrava
        CFBundleDisplayName: Shrava
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        LSUIElement: true
        NSMicrophoneUsageDescription: "Shrava needs microphone access to transcribe your voice."
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        NSAppleEventsUsageDescription: "Shrava needs accessibility access to insert text into other applications."
    entitlements:
      path: ShravaMac/Resources/ShravaMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.device.audio-input: true
        com.apple.security.network.client: true
        com.apple.security.automation.apple-events: true
        com.apple.security.temporary-exception.apple-events:
          - com.apple.systemevents
        com.apple.security.personal-information.addressbook: false
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.shrava
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.shrava
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.shrava

  ShravaIOS:
    type: application
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: ShravaIOS/Sources
      - path: Shared
      - path: ShravaIOS/Resources/Assets.xcassets
      - path: ShravaIOS/Resources/LaunchScreen.storyboard
    dependencies:
      - package: ShravaCore
      - target: ShravaKeyboard
        embed: true
      - target: ShravaLiveActivity
        embed: true
      - framework: Vendor/whisper.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shrava.ios
        INFOPLIST_FILE: ShravaIOS/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShravaIOS/Resources/ShravaIOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        OTHER_LDFLAGS: "$(inherited) -lc++"
    info:
      path: ShravaIOS/Resources/Info.plist
      properties:
        CFBundleName: Shrava
        CFBundleDisplayName: Shrava
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: APPL
        LSRequiresIPhoneOS: true
        UILaunchStoryboardName: LaunchScreen
        UIRequiredDeviceCapabilities:
          - armv7
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSMicrophoneUsageDescription: "Shrava needs microphone access to transcribe your voice."
        UIBackgroundModes:
          - audio
        NSSupportsLiveActivities: true
        CFBundleURLTypes:
          - CFBundleURLName: com.shrava.ios
            CFBundleURLSchemes:
              - shrava
    entitlements:
      path: ShravaIOS/Resources/ShravaIOS.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shrava
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)com.shrava
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.shrava
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.shrava

  ShravaKeyboard:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: ShravaKeyboard/Sources
      - path: Shared
        excludes:
          - RecordingActivityAttributes.swift
          - StopRecordingIntent.swift
    dependencies:
      - package: ShravaCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shrava.ios.keyboard
        INFOPLIST_FILE: ShravaKeyboard/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShravaKeyboard/Resources/ShravaKeyboard.entitlements
        SKIP_INSTALL: NO
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
    info:
      path: ShravaKeyboard/Resources/Info.plist
      properties:
        CFBundleName: Shrava Keyboard
        CFBundleDisplayName: Shrava Keyboard
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.keyboard-service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).KeyboardViewController
          NSExtensionAttributes:
            IsASCIICapable: true
            PrefersRightToLeft: false
            PrimaryLanguage: en-US
            RequestsOpenAccess: true
    entitlements:
      path: ShravaKeyboard/Resources/ShravaKeyboard.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.shrava
        keychain-access-groups:
          - $(AppIdentifierPrefix)com.shrava

  ShravaLiveActivity:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.1"
    sources:
      - path: ShravaLiveActivity/Sources
      - path: Shared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shrava.ios.liveactivity
        INFOPLIST_FILE: ShravaLiveActivity/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: ShravaLiveActivity/Resources/ShravaLiveActivity.entitlements
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - $(inherited)
          - "@executable_path/Frameworks"
          - "@executable_path/../../Frameworks"
        PRODUCT_NAME: ShravaLiveActivity
    info:
      path: ShravaLiveActivity/Resources/Info.plist
      properties:
        CFBundleDisplayName: Shrava Live
        CFBundleName: ShravaLiveActivity
        CFBundleIdentifier: $(PRODUCT_BUNDLE_IDENTIFIER)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleExecutable: $(EXECUTABLE_NAME)
        CFBundlePackageType: XPC!
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: ShravaLiveActivity/Resources/ShravaLiveActivity.entitlements
      properties: {}


schemes:
  ShravaMac:
    build:
      targets:
        ShravaMac: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  ShravaIOS:
    build:
      targets:
        ShravaIOS: all
        ShravaKeyboard: all
        ShravaLiveActivity: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
